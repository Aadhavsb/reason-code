name: CI

on:
  push:
  pull_request:

# This workflow uses no repository secrets, provider credentials, or deployments.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Run deterministic evaluation when available
        run: |
          if [ -f src/reason_code/evaluation/run.py ]; then
            python -m reason_code.evaluation.run --mode deterministic
          else
            echo "Deterministic evaluator not yet present; skipping until it is merged."
          fi
